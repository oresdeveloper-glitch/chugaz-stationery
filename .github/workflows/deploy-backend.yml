name: Deploy Backend to Railway
# Disabled on push: this job never actually deployed (it just ran the server
# inside CI and failed). Run manually only.
on:
  workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jakejarvis/wait-for-service@v1
        with:
          service: 'railway'
          timeout: 60
      - run: |
          cd backend
          npm install
          node server.js
