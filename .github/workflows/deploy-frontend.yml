name: Deploy to Vercel
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TEAM_ID: oresdeveloper-glitch
      VERCEL_PROJECT_ID: prj_zJ9SOfVZjJpITiyZgXow2r4P2ojb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: cd frontend && npm install && npm run build
      - run: npx vercel deploy --temporary --force --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
