name: Build and Deploy to Vercel
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: cd frontend && npm install && npm run build
      - run: cd api && npm install
      - name: Resolve serving project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DID=""
          GH_HDR=()
          if [ -n "${GH_TOKEN:-}" ]; then GH_HDR=(-H "Authorization: Bearer $GH_TOKEN"); fi
          for REF in "$GITHUB_SHA" "$GITHUB_SHA^" "$GITHUB_SHA^^" "$GITHUB_SHA^^^"; do
            TURL="$(curl -sS -m 25 "${GH_HDR[@]}" "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$REF/status" 2>/dev/null | jq -r '[.statuses[] | select(.context | endswith("chugaz-stationery")) | .target_url][0] // empty' 2>/dev/null || echo "")"
            if [ -n "$TURL" ]; then DID="$(echo "$TURL" | grep -o '[^/]*$')"; break; fi
          done
          PID=""
          if [ -n "$DID" ] && [ "$DID" != "null" ]; then
            PID="$(curl -sS -m 25 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/deployments/$DID" 2>/dev/null | jq -r '.projectId // empty' 2>/dev/null || echo "")"
          fi
          if [ -z "$PID" ]; then
            echo "RESOLVE_FELL_BACK=yes" >> "$GITHUB_ENV"
            echo "WARN: could not resolve serving project - falling back to configured project"
            PID="$VERCEL_PROJECT_ID"
          else
            echo "RESOLVE_FELL_BACK=no" >> "$GITHUB_ENV"
          fi
          echo "VERCEL_RESOLVED_PROJECT_ID=$PID" >> "$GITHUB_ENV"
      - name: diag serving project resolved by domain
        if: env.RESOLVE_FELL_BACK == 'no'
        run: echo ok
      - name: diag using configured fallback project
        if: env.RESOLVE_FELL_BACK == 'yes'
        run: echo ok
      - name: Ensure JWT_SECRET on all team projects
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          SCOPE="orresy-developer"
          fail() { echo "ENV-STATUS: FAILED - $1"; exit 1; }
          PLIST1="$(npx vercel projects ls --token="$VERCEL_TOKEN" 2>&1 || true)"
          PLIST2="$(npx vercel projects ls --scope="$SCOPE" --token="$VERCEL_TOKEN" 2>&1 || true)"
          echo "--- project list output (names and ids, no secrets) ---"
          echo "$PLIST1" | head -25 || true
          echo "$PLIST2" | head -25 || true
          echo "--- end list ---"
          IDS="$(printf '%s\n%s' "$PLIST1" "$PLIST2" | grep -oE 'prj_[A-Za-z0-9]+' | sort -u || true)"
          [ -n "$IDS" ] || fail "no project ids discovered"
          echo "Discovered projects: $(echo "$IDS" | tr '\n' ' ')"
          SECRET=""
          FAILED=0
          for PID in $IDS; do
            OUT="$(VERCEL_PROJECT_ID="$PID" npx vercel env ls --token="$VERCEL_TOKEN" 2>&1 || true)"
            if echo "$OUT" | grep -qi "JWT_SECRET.*production"; then echo "$PID: already present"; continue; fi
            [ -n "$SECRET" ] || SECRET="$(openssl rand -hex 64)"
            printf '%s' "$SECRET" | VERCEL_PROJECT_ID="$PID" npx vercel env add JWT_SECRET production --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
            printf '%s' "$SECRET" | VERCEL_PROJECT_ID="$PID" npx vercel env add JWT_SECRET preview --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
            OUT2="$(VERCEL_PROJECT_ID="$PID" npx vercel env ls --token="$VERCEL_TOKEN" 2>&1 || true)"
            if echo "$OUT2" | grep -qi "JWT_SECRET.*production"; then echo "$PID: created and verified"; else echo "$PID: MISSING"; FAILED=1; fi
          done
          unset SECRET
          if [ "$FAILED" -ne 0 ]; then echo "ENV-STATUS: FAILED"; exit 1; fi
          echo "ENV-STATUS: OK on all discovered projects"
      - name: Deploy to Vercel Production
        env:
          VERCEL_PROJECT_ID: ${{ env.VERCEL_RESOLVED_PROJECT_ID }}
        run: npx vercel deploy --prod --force --yes --token=${{ secrets.VERCEL_TOKEN }}