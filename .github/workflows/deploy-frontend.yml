name: Build and Deploy to Vercel
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: cd frontend && npm install && npm run build
      - run: cd api && npm install
      - name: Resolve serving project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          DID=""
          GH_HDR=()
          if [ -n "${GITHUB_TOKEN:-}" ]; then GH_HDR=(-H "Authorization: Bearer $GITHUB_TOKEN"); fi
          for REF in "$GITHUB_SHA" "$GITHUB_SHA^" "$GITHUB_SHA^^" "$GITHUB_SHA^^^"; do
            TURL="$(curl -sS -m 25 "${GH_HDR[@]}" "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$REF/status" 2>/dev/null | jq -r '[.statuses[] | select(.context | endswith("chugaz-stationery")) | .target_url][0] // empty' 2>/dev/null || echo "")"
            if [ -n "$TURL" ]; then DID="$(echo "$TURL" | grep -o '[^/]*$')"; break; fi
          done
          PID=""
          if [ -n "$DID" ] && [ "$DID" != "null" ]; then
            PID="$(curl -sS -m 25 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/deployments/$DID" 2>/dev/null | jq -r '.projectId // empty' 2>/dev/null || echo "")"
          fi
          if [ -z "$PID" ]; then
            echo "RESOLVE_FELL_BACK=yes" >> "$GITHUB_ENV"
            echo "WARN: could not resolve serving project - falling back to configured project"
            PID="$VERCEL_PROJECT_ID"
          else
            echo "RESOLVE_FELL_BACK=no" >> "$GITHUB_ENV"
          fi
          echo "VERCEL_RESOLVED_PROJECT_ID=$PID" >> "$GITHUB_ENV"
      - name: diag serving project resolved by domain
        if: env.RESOLVE_FELL_BACK == 'no'
        run: echo ok
      - name: diag using configured fallback project
        if: env.RESOLVE_FELL_BACK == 'yes'
        run: echo ok
      - name: Ensure JWT_SECRET on serving project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          TARGET_PID: ${{ env.VERCEL_RESOLVED_PROJECT_ID }}
        run: |
          API="https://api.vercel.com"
          EQ=""
          if [ -n "${VERCEL_TEAM_ID:-}" ]; then EQ="?teamId=$VERCEL_TEAM_ID"; fi
          PID="${TARGET_PID:-}"
          if [ -z "$PID" ]; then echo "ENV-STATUS: FAILED - no target project resolved"; exit 1; fi
          TEAM="$(curl -sS -m 30 -H "Authorization: Bearer $VERCEL_TOKEN" "$API/v9/projects/$PID" 2>/dev/null | jq -r '.accountId // empty' 2>/dev/null || echo "")"
          if [ -n "$TEAM" ]; then EQ="?teamId=$TEAM"; fi
          ENVS="$(curl -sS -m 30 -H "Authorization: Bearer $VERCEL_TOKEN" "$API/v9/projects/$PID/env$EQ" 2>/dev/null || echo "")"
          [ -n "$ENVS" ] || { echo "ENV-STATUS: FAILED - cannot list env"; exit 1; }
          if echo "$ENVS" | grep -q '"key"[[:space:]]*:[[:space:]]*"JWT_SECRET"'; then
            echo "ENV-STATUS: OK - JWT_SECRET already present on serving project"
            exit 0
          fi
          echo "JWT_SECRET missing on serving project - generating once and adding encrypted (production + preview)"
          SECRET="$(openssl rand -hex 64)"
          RESP="$(curl -sS -m 30 -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" -d "{\"key\":\"JWT_SECRET\",\"value\":\"$SECRET\",\"target\":[\"production\",\"preview\"],\"type\":\"encrypted\"}" "$API/v9/projects/$PID/env$EQ" 2>/dev/null || echo "")"
          unset SECRET
          echo "$RESP" | grep -q '"key"[[:space:]]*:[[:space:]]*"JWT_SECRET"' || { echo "ENV-STATUS: FAILED - create rejected: $(echo "$RESP" | grep -o '\"code\"[[:space:]]*:[[:space:]]*\"[^\"]*\"' | head -1)"; exit 1; }
          ENVS2="$(curl -sS -m 30 -H "Authorization: Bearer $VERCEL_TOKEN" "$API/v9/projects/$PID/env$EQ" 2>/dev/null || echo "")"
          echo "$ENVS2" | grep -q '"key"[[:space:]]*:[[:space:]]*"JWT_SECRET"' || { echo "ENV-STATUS: FAILED - still missing after create"; exit 1; }
          echo "ENV-STATUS: OK - JWT_SECRET created and verified on serving project"
      - name: Deploy to Vercel Production
        env:
          VERCEL_PROJECT_ID: ${{ env.VERCEL_RESOLVED_PROJECT_ID }}
        run: npx vercel deploy --prod --force --yes --token=${{ secrets.VERCEL_TOKEN }}