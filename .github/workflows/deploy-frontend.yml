name: Build and Deploy to Vercel
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERCEL_TEAM_ID: oresdeveloper-glitch
      VERCEL_PROJECT_ID: prj_zJ9SOfVZjJpITiyZgXow2r4P2ojb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: cd frontend && npm install && npm run build
      - name: Deploy to Vercel
        run: |
          echo "📦 Frontend built successfully"
          echo "🚀 Vercel deployment will be triggered by GitHub integration"
          # The Vercel GitHub Integration will auto-deploy on push if connected
          # If not connected, use: npx vercel deploy --token=$VERCEL_TOKEN