name: Build and Deploy to Vercel
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: cd frontend && npm install && npm run build
      - run: cd api && npm install
      - name: Resolve serving project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          API="https://api.vercel.com"
          AUTH="Authorization: Bearer $VERCEL_TOKEN"
          PID="$(curl -sS -m 25 -H "$AUTH" "$API/v9/projects/chugaz-stationery" 2>/dev/null | jq -r '.id // empty' 2>/dev/null || echo "")"
          if [ -n "$PID" ]; then echo "Resolved serving project by name"; fi
          if [ -z "$PID" ]; then
            PID="$(curl -sS -m 25 -H "$AUTH" "$API/v9/deployments/GSK3xAczRmyZiaNBhRyVjWoYAmbK" 2>/dev/null | jq -r '.projectId // empty' 2>/dev/null || echo "")"
            if [ -n "$PID" ]; then echo "Resolved serving project via deployment record"; fi
          fi
          if [ -z "$PID" ]; then
            echo "WARN: could not resolve serving project - falling back to configured project"
            PID="$VERCEL_PROJECT_ID"
          fi
          echo "Serving project id: $PID"
          echo "VERCEL_RESOLVED_PROJECT_ID=$PID" >> "$GITHUB_ENV"
      - name: Ensure JWT_SECRET on serving project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET_PID: ${{ env.VERCEL_RESOLVED_PROJECT_ID }}
        run: |
          API="https://api.vercel.com"
          AUTH="Authorization: Bearer $VERCEL_TOKEN"
          fail() { echo "ENV-STATUS: FAILED - $1"; exit 1; }
          PID="${TARGET_PID:-}"
          [ -n "$PID" ] || fail "no target project resolved"
          ENVS="$(curl -sS -m 30 -H "$AUTH" "$API/v9/projects/$PID/env" 2>/dev/null || echo "")"
          [ -n "$ENVS" ] || fail "cannot list env"
          if echo "$ENVS" | grep -q '"key"[[:space:]]*:[[:space:]]*"JWT_SECRET"'; then
            echo "ENV-STATUS: OK - JWT_SECRET already present on serving project"
            exit 0
          fi
          echo "JWT_SECRET missing on serving project - generating once and adding encrypted (production + preview)"
          SECRET="$(openssl rand -hex 64)"
          RESP="$(curl -sS -m 30 -X POST -H "$AUTH" -H "Content-Type: application/json" -d "{\"key\":\"JWT_SECRET\",\"value\":\"$SECRET\",\"target\":[\"production\",\"preview\"],\"type\":\"encrypted\"}" "$API/v9/projects/$PID/env" 2>/dev/null || echo "")"
          unset SECRET
          echo "$RESP" | grep -q '"key"[[:space:]]*:[[:space:]]*"JWT_SECRET"' || fail "create rejected: $(echo "$RESP" | grep -o '\"code\"[[:space:]]*:[[:space:]]*\"[^\"]*\"' | head -1)"
          ENVS2="$(curl -sS -m 30 -H "$AUTH" "$API/v9/projects/$PID/env" 2>/dev/null || echo "")"
          echo "$ENVS2" | grep -q '"key"[[:space:]]*:[[:space:]]*"JWT_SECRET"' || fail "still missing after create"
          echo "ENV-STATUS: OK - JWT_SECRET created and verified on serving project"
      - name: Deploy to Vercel Production
        env:
          VERCEL_PROJECT_ID: ${{ env.VERCEL_RESOLVED_PROJECT_ID }}
        run: npx vercel deploy --prod --force --yes --token=${{ secrets.VERCEL_TOKEN }}